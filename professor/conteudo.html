<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Aula</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2224%22%20height=%2224%22%20viewBox=%220%200%2024%2024%22%20fill=%22none%22%20stroke=%22%231d2b64%22%20stroke-width=%222%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Cpath%20stroke=%22none%22%20d=%22M0%200h24v24H0z%22%20fill=%22none%22/%3E%3Cpath%20d=%22M14%203v4a1%201%200%200%200%201%201h4%22/%3E%3Cpath%20d=%22M17%2021H7a2%202%200%200%201-2-2V5a2%202%200%200%201%202-2h7l5%205v11a2%202%200%200%201-2%202%22/%3E%3Cpath%20d=%22M10%2018l5-5a1.414%201.414%200%200%200-2-2l-5%205v2h2%22/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1d2b64;
    --royal: #2b57c3;
    --sky: #5c83f1;
    --gray-blue: #708ea8;
    --border-gray: #e0e0e0;
    --bg: #f4f7ff;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
    padding: 2.5rem 1.5rem;
    display: flex;
    justify-content: center;
  }

  .main-container {
    width: 100%; max-width: 620px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }

  /* HEADER */
  .header { margin-bottom: 1.75rem; }
  .header h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 3px; }
  .header p { color: var(--gray-blue); font-size: 0.87rem; font-weight: 500; }

  /* CARD */
  .card {
    background: white;
    padding: 2rem;
    border-radius: 22px;
    border: 1px solid var(--border-gray);
    box-shadow: 0 4px 24px rgba(29,43,100,0.07);
  }

  /* SECTION TITLE */
  .section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.68rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--royal); margin-bottom: 1rem;
  }
  .section-title i { font-size: 15px; }

  .divider { height: 1px; background: var(--border-gray); margin: 1.5rem 0; }

  /* OPTIONS */
  .options-grid { display: grid; gap: 8px; margin-bottom: 1.5rem; }

  .option-item {
    display: flex; align-items: center;
    padding: 0.85rem 1rem;
    background: var(--bg);
    border: 1.5px solid transparent;
    border-radius: 14px; cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .option-item:hover { border-color: rgba(44,87,195,0.25); background: #eef1fc; }
  .option-item:has(input:checked) { border-color: rgba(44,87,195,0.35); background: #eef1fc; }

  .option-item input[type="checkbox"] {
    appearance: none; width: 20px; height: 20px;
    border: 2px solid var(--border-gray);
    border-radius: 6px; margin-right: 12px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, border-color 0.2s ease;
    background: white; position: relative;
  }
  .option-item input[type="checkbox"]:checked {
    background: var(--royal); border-color: var(--royal);
  }
  .option-item input[type="checkbox"]:checked::after {
    content: '\eb33'; font-family: 'tabler-icons';
    color: white; font-size: 13px;
    position: absolute;
  }

  .option-item label {
    font-size: 0.88rem; font-weight: 600; cursor: pointer; flex: 1;
    color: var(--navy);
  }

  /* CAMPOS DINÂMICOS */
  .dynamic-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
    animation: slideIn 0.25s ease;
  }
  .dynamic-row i.ti-check { color: #f59e0b; font-size: 16px; flex-shrink: 0; }

  .input-custom {
    flex: 1; padding: 0.75rem 1rem;
    border-radius: 12px; border: 1.5px solid var(--border-gray);
    font-family: inherit; font-size: 0.88rem; font-weight: 500;
    color: var(--navy); background: var(--bg); outline: none;
    transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .input-custom::placeholder { color: var(--gray-blue); font-weight: 400; }
  .input-custom:focus { border-color: var(--royal); background: white; box-shadow: 0 0 0 3px rgba(44,87,195,0.08); }

  .btn-remove {
    color: var(--gray-blue); cursor: pointer;
    font-size: 16px; padding: 4px; flex-shrink: 0;
    transition: color 0.2s;
  }
  .btn-remove:hover { color: #dc2626; }

  .btn-add {
    width: 100%; padding: 0.85rem;
    background: none;
    border: 1.5px dashed var(--border-gray);
    border-radius: 14px;
    color: var(--gray-blue); font-family: inherit;
    font-size: 0.85rem; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .btn-add:hover { border-color: var(--royal); color: var(--royal); background: rgba(44,87,195,0.03); }

  /* BOTÃO SALVAR */
  .btn-save {
    width: 100%; padding: 1rem;
    background: linear-gradient(135deg, var(--navy), #2a3d8c);
    color: white; border: none; border-radius: 14px;
    font-family: inherit; font-size: 0.95rem; font-weight: 700;
    margin-top: 1.5rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
  }
  .btn-save:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(29,43,100,0.22); filter: brightness(1.08); }
  .btn-save:active { transform: translateY(0); }
</style>
</head>
<body>

<div class="main-container">
  <div class="header">
    <h1>Registrar Aula</h1>
    <p id="instrucao-materia">Selecione os tópicos abordados na aula de hoje.</p>
  </div>

  <div class="card">

    <div id="container-teorico">
      <div class="section-title"><i class="ti ti-book"></i> Conteúdo Teórico</div>
      <div class="options-grid" id="grid-teorico"></div>
    </div>

    <div class="divider" id="divider-teorico"></div>

    <div class="section-title"><i class="ti ti-pencil"></i> Atividades Práticas</div>
    <div class="options-grid" id="grid-pratico"></div>

    <div class="divider"></div>

    <div class="section-title" style="margin-bottom: 0.75rem;"><i class="ti ti-plus"></i> Conteúdo Extra</div>
    <div id="extra-inputs"></div>
    <button class="btn-add" onclick="adicionarCampo()">
      <i class="ti ti-circle-plus"></i> Adicionar outro tópico
    </button>

    <button class="btn-save" onclick="finalizarLancamento()">
      Salvar Registro
      <i class="ti ti-device-floppy"></i>
    </button>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAs3OTqOeVVzcxlrcM8Th5ObkhtXca69Ac",
    authDomain: "mindspace-educacao.firebaseapp.com",
    projectId: "mindspace-educacao",
    storageBucket: "mindspace-educacao.firebasestorage.app",
    messagingSenderId: "569394609531",
    appId: "1:569394609531:web:9ab5ba6bc2181bc5a911de",
    databaseURL: "https://mindspace-educacao-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const materiaAtiva = sessionStorage.getItem('materia') || "Artes";
  const mapDb = { "Ciências": "cien", "Português": "port", "Matemática": "mat", "Artes": "artes" };
  const materiaDb = mapDb[materiaAtiva];

  document.getElementById('instrucao-materia').innerText = `Selecione os tópicos abordados na aula de ${materiaAtiva} de hoje.`;

  const opcoesPorMateria = {
    "Artes": {
      teorico: [],
      pratico: ["Aula 1", "Aula 2", "Aula 3"]
    },
    "Ciências": {
      teorico: ["Capítulo 1: O Corpo Humano", "Capítulo 2: Os 5 sentidos", "Capítulo 3: Higiene e Saúde"],
      pratico: ["Praticando - Capítulo 1", "Revisando - Capítulo 1", "Praticando - Capítulo 2", "Revisando - Capítulo 2", "Praticando - Capítulo 3", "Revisando - Capítulo 3"]
    },
    "Português": {
      teorico: ["Capítulo 1: O Alfabeto", "Capítulo 2: As Sílabas", "Capítulo 3: Substantivo e Adjetivo"],
      pratico: ["Praticando - Capítulo 1", "Revisando - Capítulo 1", "Praticando - Capítulo 2", "Revisando - Capítulo 2", "Praticando - Capítulo 3", "Revisando - Capítulo 3"]
    },
    "Matemática": {
      teorico: ["Capítulo 1: Os Números", "Capítulo 2: As Formas geométricas", "Capítulo 3: Grandezas e medidas"],
      pratico: ["Praticando - Capítulo 1", "Revisando - Capítulo 1", "Praticando - Capítulo 2", "Revisando - Capítulo 2", "Praticando - Capítulo 3", "Revisando - Capítulo 3"]
    }
  };

  const config = opcoesPorMateria[materiaAtiva];

  const renderGrid = (containerId, lista) => {
    const container = document.getElementById(containerId);
    if (lista.length === 0) {
      if (containerId === 'grid-teorico') {
        document.getElementById('container-teorico').style.display = 'none';
        document.getElementById('divider-teorico').style.display = 'none';
      }
      return;
    }
    lista.forEach(item => {
      const div = document.createElement('div');
      div.className = 'option-item';
      div.innerHTML = `<input type="checkbox" value="${item}" id="cb-${item}"><label for="cb-${item}">${item}</label>`;
      div.onclick = (e) => { if (e.target.tagName !== 'INPUT') div.querySelector('input').click(); };
      container.appendChild(div);
    });
  };

  renderGrid('grid-teorico', config.teorico);
  renderGrid('grid-pratico', config.pratico);

  window.adicionarCampo = () => {
    const container = document.getElementById('extra-inputs');
    const div = document.createElement('div');
    div.className = 'dynamic-row';
    div.innerHTML = `
      <i class="ti ti-check" style="color:#f59e0b; font-size:16px; flex-shrink:0"></i>
      <input type="text" class="input-custom" placeholder="Digite o conteúdo extra...">
      <i class="ti ti-trash btn-remove" onclick="this.parentElement.remove()"></i>
    `;
    container.appendChild(div);
    div.querySelector('input').focus();
  };

  window.finalizarLancamento = () => {
    const selecionados = [];
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => selecionados.push(cb.value));
    document.querySelectorAll('.input-custom').forEach(input => {
      if (input.value.trim()) selecionados.push(input.value.trim());
    });

    if (selecionados.length === 0) {
      alert("⚠️ Selecione ao menos um item antes de salvar.");
      return;
    }

    const dbRef = ref(db, `${materiaDb}/trabalhados`);
    push(dbRef, {
      itens: selecionados,
      data: new Date().toLocaleDateString('pt-BR'),
      hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    }).then(() => {
      alert("✅ Aula registrada com sucesso!");
      window.location.href = "dashboard.html";
    }).catch(err => {
      console.error(err);
      alert("Erro ao salvar. Verifique o console.");
    });
  };
</script>

</body>
</html>
