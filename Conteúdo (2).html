<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Aula</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2224%22%20height=%2224%22%20viewBox=%220%200%2024%2024%22%20fill=%22none%22%20stroke=%22currentColor%22%20stroke-width=%221.5%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%20class=%22icon%20icon-tabler%20icons-tabler-outline%20icon-tabler-file-pencil%22%3E%3Cpath%20stroke=%22none%22%20d=%22M0%200h24v24H0z%22%20fill=%22none%22%20/%3E%3Cpath%20d=%22M14%203v4a1%201%200%200%200%201%201h4%22%20/%3E%3Cpath%20d=%22M17%2021h-10a2%202%200%200%201%20-2%20-2v-14a2%202%200%200%201%202%20-2h7l5%205v11a2%202%200%200%201%20-2%202%22%20/%3E%3Cpath%20d=%22M10%2018l5%20-5a1.414%201.414%200%200%200%20-2%20-2l-5%205v2h2%22%20/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0f172a;
    --royal: #2563eb;
    --sky: #3b82f6;
    --gray-blue: #64748b;
    --border-gray: #e2e8f0;
    --bg: #f8fafc;
    --white: #ffffff;
  }

  body { 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    background: var(--bg); 
    color: var(--navy);
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }

  .main-container { width: 100%; max-width: 650px; animation: fadeIn 0.6s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .header { margin-bottom: 40px; text-align: center; }
  .header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
  .header p { color: var(--gray-blue); font-weight: 500; }

  .card {
    background: var(--white);
    padding: 40px;
    border-radius: 32px;
    border: 1px solid var(--border-gray);
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.05);
  }

  .section-title {
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--royal);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .options-grid { display: grid; gap: 12px; margin-bottom: 32px; }

  .option-item {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    background: #f8fafc;
    border: 2px solid transparent;
    border-radius: 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .option-item:hover { border-color: var(--sky); background: #f1f5f9; }

  .option-item input[type="checkbox"] {
    appearance: none;
    width: 22px;
    height: 22px;
    border: 2px solid #cbd5e1;
    border-radius: 6px;
    margin-right: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: white;
  }

  .option-item input[type="checkbox"]:checked {
    background: var(--royal);
    border-color: var(--royal);
  }

  .option-item input[type="checkbox"]:checked::after {
    content: '\eb33';
    font-family: 'tabler-icons';
    color: white;
    font-size: 14px;
  }

  .option-item label {
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    flex: 1;
  }

  .dynamic-section { margin-top: 24px; border-top: 1px solid var(--border-gray); pt: 24px; }
  .dynamic-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; animation: slideIn 0.3s ease; }
  
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } }

  .input-custom {
    flex: 1;
    padding: 14px 20px;
    border-radius: 14px;
    border: 2px solid var(--border-gray);
    font-family: inherit;
    font-weight: 600;
    outline: none;
    transition: all 0.2s;
  }

  .input-custom:focus { border-color: var(--royal); }

  .btn-add {
    width: 100%;
    padding: 16px;
    background: none;
    border: 2px dashed var(--border-gray);
    border-radius: 18px;
    color: var(--gray-blue);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
  }

  .btn-add:hover { border-color: var(--royal); color: var(--royal); background: rgba(37, 99, 235, 0.02); }

  .btn-save {
    width: 100%;
    padding: 20px;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 20px;
    font-size: 1.1rem;
    font-weight: 700;
    margin-top: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: all 0.3s;
  }

  .btn-save:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2); }
  
  .btn-remove { color: #ef4444; cursor: pointer; padding: 5px; font-size: 1.2rem; }
</style>
</head>
<body>

<div class="main-container">
  <div class="header">
    <h1>Registrar Aula</h1>
    <p id="instrucao-materia">Selecione os tópicos abordados na aula de hoje.</p>
  </div>

  <div class="card">
    <div id="container-teorico">
      <div class="section-title"><i class="ti ti-book"></i> Conteúdo Teórico</div>
      <div class="options-grid" id="grid-teorico">
        </div>
    </div>

    <div class="section-title"><i class="ti ti-pencil"></i> Atividades Práticas</div>
    <div class="options-grid" id="grid-pratico">
      </div>

    <div class="dynamic-section">
      <div class="section-title" style="margin-top:24px"><i class="ti ti-plus"></i> Conteúdo Extra</div>
      <div id="extra-inputs"></div>
      <button class="btn-add" onclick="adicionarCampo()">
        <i class="ti ti-circle-plus"></i> Adicionar outro tópico
      </button>
    </div>

    <button class="btn-save" onclick="finalizarLancamento()">
      Salvar Registro
      <i class="ti ti-device-floppy"></i>
    </button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAs3OTqOeVVzcxlrcM8Th5ObkhtXca69Ac",
    authDomain: "mindspace-educacao.firebaseapp.com",
    projectId: "mindspace-educacao",
    storageBucket: "mindspace-educacao.firebasestorage.app",
    messagingSenderId: "569394609531",
    appId: "1:569394609531:web:9ab5ba6bc2181bc5a911de",
    databaseURL: "https://mindspace-educacao-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 1. IDENTIFICAÇÃO DA MATÉRIA
  const materiaAtiva = sessionStorage.getItem('materia') || "Artes";
  const mapDb = { "Ciências": "cien", "Português": "port", "Matemática": "mat", "Artes": "artes" };
  const materiaDb = mapDb[materiaAtiva];

  // Atualiza o texto da instrução
  document.getElementById('instrucao-materia').innerText = `Selecione os tópicos abordados na aula de ${materiaAtiva} de hoje.`;

  // 2. CONFIGURAÇÃO DE OPÇÕES POR MATÉRIA
  const opcoesPorMateria = {
    "Artes": {
      teorico: [], // Vazio para tirar conteúdo teórico
      pratico: ["Aula 1", "Aula 2", "Aula 3"]
    },
    "Ciências": {
      teorico: ["Capítulo 1: O Corpo Humano", "Capítulo 2: Os 5 sentidos", "Capítulo 3: Higiene e Saúde"],
      pratico: ["Praticando - Capítulo 1", "Revisando - Capítulo 1", "Praticando - Capítulo 2", "Revisando - Capítulo 2", "Praticando - Capítulo 3", "Revisando - Capítulo 3"]
    },
    "Português": {
      teorico: ["Capítulo 1: O Alfabeto", "Capítulo 2: As Sílabas", "Capítulo 3: Substantivo e Adjetivo"],
      pratico: ["Praticando - Capítulo 1", "Revisando - Capítulo 1", "Praticando - Capítulo 2", "Revisando - Capítulo 2", "Praticando - Capítulo 3", "Revisando - Capítulo 3"]
    },
    "Matemática": {
      teorico: ["Capítulo 1: Os Números", "Capítulo 2: As Formas geométricas", "Capítulo 3: Grandezas e medidas"],
      pratico: ["Praticando - Capítulo 1", "Revisando - Capítulo 1", "Praticando - Capítulo 2", "Revisando - Capítulo 2", "Praticando - Capítulo 3", "Revisando - Capítulo 3"]
    }
  };

  const config = opcoesPorMateria[materiaAtiva];

  // 3. RENDERIZAR OPÇÕES
  const renderGrid = (containerId, lista) => {
    const container = document.getElementById(containerId);
    if (lista.length === 0) {
      if(containerId === 'grid-teorico') document.getElementById('container-teorico').style.display = 'none';
      return;
    }
    lista.forEach(item => {
      const div = document.createElement('div');
      div.className = 'option-item';
      div.innerHTML = `<input type="checkbox" value="${item}" id="${item}"><label for="${item}">${item}</label>`;
      div.onclick = (e) => { if(e.target.tagName !== 'INPUT') div.querySelector('input').click(); };
      container.appendChild(div);
    });
  };

  renderGrid('grid-teorico', config.teorico);
  renderGrid('grid-pratico', config.pratico);

  // 4. LÓGICA DE CAMPOS DINÂMICOS
  window.adicionarCampo = () => {
    const container = document.getElementById('extra-inputs');
    const div = document.createElement('div');
    div.className = 'dynamic-row';
    div.innerHTML = `
      <i class="ti ti-check" style="color:#f59e0b"></i>
      <input type="text" class="input-custom" placeholder="Digite o conteúdo extra...">
      <i class="ti ti-trash btn-remove" onclick="this.parentElement.remove()"></i>
    `;
    container.appendChild(div);
    div.querySelector('input').focus();
  };

  // 5. LÓGICA DE SALVAMENTO AUTOMÁTICO
  window.finalizarLancamento = () => {
    const selecionados = [];
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => selecionados.push(cb.value));
    document.querySelectorAll('.input-custom').forEach(input => {
      if(input.value.trim()) selecionados.push(input.value.trim());
    });

    if(selecionados.length === 0) {
      alert("⚠️ Selecione ao menos um item antes de salvar.");
      return;
    }

    // SALVA NO CAMINHO DINÂMICO: ex: cien/trabalhados
    const dbRef = ref(db, `${materiaDb}/trabalhados`);

    push(dbRef, {
      itens: selecionados,
      data: new Date().toLocaleDateString('pt-BR'),
      hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    }).then(() => {
      alert("✅ Aula registrada com sucesso!");
      window.location.href = "Área%20do%20Professor%20(2).html"; // Volta para o painel
    }).catch(err => {
      console.error(err);
      alert("Erro ao salvar. Verifique o console.");
    });
  };
</script>

</body>
</html>
