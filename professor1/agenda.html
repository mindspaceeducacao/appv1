<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2224%22%20height=%2224%22%20viewBox=%220%200%2024%2024%22%20fill=%22none%22%20stroke=%22%231d2b64%22%20stroke-width=%222%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Cpath%20stroke=%22none%22%20d=%22M0%200h24v24H0z%22%20fill=%22none%22/%3E%3Cpath%20d=%22M4%207a2%202%200%200%201%202-2h12a2%202%200%200%201%202%202v12a2%202%200%200%201-2%202H6a2%202%200%200%201-2-2V7z%22/%3E%3Cpath%20d=%22M16%203v4M8%203v4M4%2011h16%22/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1d2b64;
    --royal: #2b57c3;
    --sky: #5c83f1;
    --gray-blue: #708ea8;
    --border-gray: #e0e0e0;
    --bg: #f4f7ff;
    --emerald: #0ea47a;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
    padding: 2.5rem 1.5rem;
    display: flex;
    justify-content: center;
  }

  .wrapper {
    width: 100%; max-width: 860px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* HEADER */
  .page-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 2rem;
  }
  .btn-back {
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--gray-blue);
    font-weight: 600; font-size: 0.83rem;
    margin-bottom: 0.6rem;
    transition: color 0.2s;
  }
  .btn-back:hover { color: var(--royal); }
  .page-header h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; }

  /* CALENDAR CARD */
  .calendar-card {
    background: white;
    border: 1px solid var(--border-gray);
    border-radius: 24px;
    padding: 2rem;
    box-shadow: 0 4px 24px rgba(29,43,100,0.07);
  }

  .calendar-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2rem;
  }
  .month-title { font-size: 1.2rem; font-weight: 800; color: var(--navy); }
  .nav-btns { display: flex; gap: 6px; }
  .btn-nav {
    width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--border-gray);
    background: white; color: var(--gray-blue);
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .btn-nav:hover { border-color: var(--royal); color: var(--royal); background: rgba(44,87,195,0.05); }

  .weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 8px; margin-bottom: 8px;
  }
  .weekdays span {
    text-align: center; font-size: 0.7rem; font-weight: 800;
    color: var(--gray-blue); text-transform: uppercase; letter-spacing: 0.08em;
  }

  .days-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
  }
  .day {
    aspect-ratio: 1/1; border-radius: 12px;
    border: 1px solid var(--border-gray);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.88rem;
    cursor: pointer; position: relative; background: white;
    transition: transform 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }
  .day:hover { transform: translateY(-2px); border-color: var(--royal); color: var(--royal); box-shadow: 0 4px 12px rgba(44,87,195,0.1); }
  .day.today { background: var(--navy); color: white; border-color: var(--navy); }
  .day.today:hover { box-shadow: 0 4px 16px rgba(29,43,100,0.25); }
  .day.has-task::after {
    content: ''; position: absolute; bottom: 6px;
    width: 5px; height: 5px;
    background: var(--emerald); border-radius: 50%;
  }
  .day.today.has-task::after { background: rgba(255,255,255,0.7); }

  /* MODAL */
  .modal {
    position: fixed; inset: 0;
    background: rgba(29,43,100,0.4);
    backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .modal-content {
    background: white; width: 90%; max-width: 460px;
    padding: 2rem; border-radius: 22px;
    border: 1px solid var(--border-gray);
    box-shadow: 0 24px 60px rgba(29,43,100,0.18);
    animation: modalPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes modalPop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-header { margin-bottom: 1.25rem; }
  .modal-header h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 3px; }
  .modal-header p { color: var(--gray-blue); font-size: 0.83rem; font-weight: 500; }

  textarea {
    width: 100%; height: 130px;
    border-radius: 14px; border: 1.5px solid var(--border-gray);
    padding: 1rem; font-family: inherit;
    font-size: 0.92rem; font-weight: 500;
    resize: none; outline: none;
    background: var(--bg);
    color: var(--navy);
    transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  textarea:focus { border-color: var(--royal); background: white; box-shadow: 0 0 0 3px rgba(44,87,195,0.08); }

  .modal-footer { display: flex; gap: 10px; margin-top: 1.25rem; }
  .btn-save {
    flex: 2; background: linear-gradient(135deg, var(--royal), var(--sky));
    color: white; border: none; padding: 0.85rem;
    border-radius: 12px; font-family: inherit;
    font-size: 0.9rem; font-weight: 700; cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }
  .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(44,87,195,0.28); filter: brightness(1.06); }
  .btn-close {
    flex: 1; background: var(--bg); color: var(--gray-blue);
    border: 1px solid var(--border-gray); padding: 0.85rem;
    border-radius: 12px; font-family: inherit;
    font-size: 0.9rem; font-weight: 700; cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-close:hover { border-color: var(--gray-blue); color: var(--navy); }
</style>
</head>
<body>

<div class="wrapper">
  <div class="page-header">
    <div>
      <a href="dashboard.html" class="btn-back"><i class="ti ti-arrow-left"></i> Voltar</a>
      <h1>Agenda de Planejamento</h1>
    </div>
    <i class="ti ti-calendar-event" style="font-size: 2.5rem; color: var(--sky); opacity: 0.25;"></i>
  </div>

  <div class="calendar-card">
    <div class="calendar-nav">
      <div class="month-title" id="month-display">Janeiro 2024</div>
      <div class="nav-btns">
        <button class="btn-nav" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
        <button class="btn-nav" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
    </div>

    <div class="weekdays">
      <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
    </div>

    <div class="days-grid" id="calendar-grid"></div>
  </div>
</div>

<div class="modal" id="task-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-title">Plano do Dia</h2>
      <p>O que será trabalhado nesta data?</p>
    </div>
    <textarea id="task-text" placeholder="Ex: Iniciar capítulo 4, aplicar dinâmica de grupo..."></textarea>
    <div class="modal-footer">
      <button class="btn-close" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" id="save-task">Salvar Plano</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAs3OTqOeVVzcxlrcM8Th5ObkhtXca69Ac",
    authDomain: "mindspace-educacao.firebaseapp.com",
    projectId: "mindspace-educacao",
    storageBucket: "mindspace-educacao.firebasestorage.app",
    messagingSenderId: "569394609531",
    appId: "1:569394609531:web:9ab5ba6bc2181bc5a911de",
    databaseURL: "https://mindspace-educacao-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const tasksRef = ref(db, 'daniel_lucca/artes/agenda');

  let date = new Date();
  let allTasks = {};
  let currentSelectedDay = "";

  function renderCalendar() {
    const grid = document.getElementById('calendar-grid');
    const monthDisplay = document.getElementById('month-display');
    grid.innerHTML = '';

    const year = date.getFullYear();
    const month = date.getMonth();

    monthDisplay.innerText = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(date);

    const firstDay = new Date(year, month, 1).getDay();
    const lastDay = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      grid.appendChild(document.createElement('div'));
    }

    const today = new Date();
    for (let i = 1; i <= lastDay; i++) {
      const dayId = `${year}-${month + 1}-${i}`;
      const isToday = i === today.getDate() && month === today.getMonth() && year === today.getFullYear();
      const hasTask = allTasks[dayId] && allTasks[dayId].trim() !== '';

      const dayEl = document.createElement('div');
      dayEl.className = `day ${isToday ? 'today' : ''} ${hasTask ? 'has-task' : ''}`;
      dayEl.innerText = i;
      dayEl.onclick = () => openModal(i, dayId);
      grid.appendChild(dayEl);
    }
  }

  window.changeMonth = (val) => {
    date.setMonth(date.getMonth() + val);
    renderCalendar();
  };

  window.openModal = (num, id) => {
    currentSelectedDay = id;
    document.getElementById('modal-title').innerText = `Dia ${num}`;
    document.getElementById('task-text').value = allTasks[id] || '';
    document.getElementById('task-modal').style.display = 'flex';
    setTimeout(() => document.getElementById('task-text').focus(), 50);
  };

  window.closeModal = () => {
    document.getElementById('task-modal').style.display = 'none';
  };

  document.getElementById('save-task').onclick = () => {
    const text = document.getElementById('task-text').value;
    update(tasksRef, { [currentSelectedDay]: text }).then(() => closeModal());
  };

  onValue(tasksRef, (snapshot) => {
    allTasks = snapshot.val() || {};
    renderCalendar();
  });

  window.onclick = (event) => {
    const modal = document.getElementById('task-modal');
    if (event.target == modal) closeModal();
  };
</script>
</body>
</html>
