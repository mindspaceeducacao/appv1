<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar como Professor</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2224%22%20height=%2224%22%20viewBox=%220%200%2024%2024%22%20fill=%22none%22%20stroke=%22%231d2b64%22%20stroke-width=%222%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%20class=%22icon%20icon-tabler%20icons-tabler-outline%20icon-tabler-chalkboard%22%3E%3Cpath%20stroke=%22none%22%20d=%22M0%200h24v24H0z%22%20fill=%22none%22%20/%3E%3Cpath%20d=%22M8%2019h-3a2%202%200%200%201%20-2%20-2v-10a2%202%200%200%201%202%20-2h14a2%202%200%200%201%202%202v11a1%201%200%200%201%20-1%201%22%20/%3E%3Cpath%20d=%22M11%2017a1%201%200%200%201%201%20-1h4a1%201%200%200%201%201%201v1a1%201%200%200%201%20-1%201h-4a1%201%200%200%201%20-1%20-1l0%20-1%22%20/%3E%3C/svg%3E">
<style>
  /* MANTIVE SEU CSS ORIGINAL */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0f172a;
    --royal: #2563eb;
    --sky: #3b82f6;
    --gray-blue: #64748b;
    --border-gray: #e2e8f0;
    --bg: #f8fafc;
  }

  body { 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    background: var(--bg); 
    background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
    background-size: 30px 30px;
    color: var(--navy); 
    min-height: 100vh; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    overflow: hidden; 
  }

  .blobs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15; animation: blobFloat 20s ease-in-out infinite; }
  .blob1 { width: 600px; height: 600px; background: var(--royal); top: -100px; right: -100px; }
  .blob2 { width: 400px; height: 400px; background: var(--sky); bottom: -50px; left: -50px; animation-delay: -5s; }
  
  @keyframes blobFloat {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px, -50px) scale(1.1); }
  }

  .teacher-card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    width: 1000px;
    display: flex;
    border-radius: 32px;
    box-shadow: 0 40px 100px rgba(15, 23, 42, 0.15);
    overflow: hidden;
    border: 1px solid white;
  }

  .welcome-side {
    flex: 1;
    background: var(--navy);
    padding: 4.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: white;
    position: relative;
    overflow: hidden;
  }

  .header-icon-teacher {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #3d4655, var(--gray-blue));
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: white;
    margin-bottom: 2.5rem;
  }

  .welcome-side h1 { font-size: 2.8rem; font-weight: 800; line-height: 1.1; margin-bottom: 1.5rem; letter-spacing: -1.5px; }
  .welcome-side p { font-size: 1.1rem; opacity: 0.6; line-height: 1.6; }

  .disciplinas-badge { margin-top: 3rem; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { padding: 6px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); border-radius: 99px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }

  .login-side { flex: 1.3; padding: 5rem 6.5rem; display: flex; flex-direction: column; justify-content: center; background: white; }
  .login-side h2 { font-size: 2rem; font-weight: 800; color: var(--navy); margin-bottom: 0.5rem; }
  .subtitle { color: var(--gray-blue); font-size: 0.95rem; margin-bottom: 3rem; display: block; }

  .input-group { margin-bottom: 1.5rem; position: relative; }
  .input-group i.main-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--gray-blue); font-size: 1.3rem; }

  .teacher-input {
    width: 100%;
    padding: 1.3rem 3.5rem 1.3rem 3.8rem;
    border: 2px solid var(--border-gray);
    border-radius: 20px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--navy);
    outline: none;
    background: #f8fafc;
  }

  .teacher-input:focus { border-color: var(--royal); background: white; }

  .toggle-password { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gray-blue); cursor: pointer; font-size: 1.3rem; }

  .btn-teacher {
    width: 100%;
    padding: 1.4rem;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 20px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 1rem;
  }

  .error-msg { color: #ef4444; font-size: 0.9rem; margin-top: 1.5rem; font-weight: 700; text-align: center; display: none; }
  .back-link { margin-top: 3.5rem; text-decoration: none; font-size: 0.95rem; font-weight: 700; color: var(--gray-blue); display: flex; align-items: center; justify-content: center; gap: 10px; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
</style>
</head>
<body>

<div class="blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
</div>

<div class="teacher-card">
  <div class="welcome-side">
    <div class="header-icon-teacher">
      <i class="ti ti-presentation-analytics"></i>
    </div>
    <h1>Espaço do<br>Docente</h1>
    <p>Acesse o centro de controle pedagógico para gerenciar turmas e conteúdos digitais.</p>
    
    <div class="disciplinas-badge">
      <span class="badge">Artes</span>
      <span class="badge">Ciências</span>
      <span class="badge">Português</span>
      <span class="badge">Matemática</span>
    </div>
  </div>

  <div class="login-side">
    <h2>Entrar na conta</h2>
    <span class="subtitle">Bem-vindo de volta! Insira seus dados.</span>

    <form id="teacherForm">
      <div class="input-group">
        <i class="ti ti-mail-opened main-icon"></i>
        <input type="text" id="user" class="teacher-input" placeholder="Usuário ou ID" required>
      </div>

      <div class="input-group">
        <i class="ti ti-lock-square-rounded main-icon"></i>
        <input type="password" id="pass" class="teacher-input" placeholder="Senha" required>
        <button type="button" class="toggle-password" id="togglePass">
          <i class="ti ti-eye" id="eyeIcon"></i>
        </button>
      </div>

      <button type="submit" class="btn-teacher">
        Entrar no Painel
        <i class="ti ti-arrow-right"></i>
      </button>

      <p id="errorMsg" class="error-msg">Credenciais inválidas. Tente novamente.</p>
    </form>

    <a href="mindspace_portal.html" class="back-link">
      <i class="ti ti-arrow-narrow-left"></i> Voltar para Perfis
    </a>
  </div>
</div>

<script>
  // Link Único para todos os professores
  const URL_PAINEL = "file:///C:/Users/minds/Desktop/Site%20-%202%C2%AA%20Vers%C3%A3o/Professor/Artes/%C3%81rea%20do%20Professor%20(2).html"; 

  const accounts = {
    "hadassaartes": { pass: "hbmind26", materia: "Artes" },
    "dluccaport":  { pass: "dlmind26", materia: "Português" },
    "hadassacien": { pass: "hbmind26", materia: "Ciências" },
    "dluccamat":   { pass: "dlmind26", materia: "Matemática" }
  };

  const passInput = document.getElementById('pass');
  const toggleBtn = document.getElementById('togglePass');
  const eyeIcon = document.getElementById('eyeIcon');

  toggleBtn.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    eyeIcon.className = isPass ? 'ti ti-eye-off' : 'ti ti-eye';
  });

  document.getElementById('teacherForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const user = document.getElementById('user').value.toLowerCase().trim();
    const pass = document.getElementById('pass').value;
    const error = document.getElementById('errorMsg');

    if (accounts[user] && accounts[user].pass === pass) {
      // SALVANDO A SESSÃO NO NAVEGADOR
      sessionStorage.setItem('logado', 'true');
      sessionStorage.setItem('usuario', user);
      sessionStorage.setItem('materia', accounts[user].materia);
      
      // Redireciona para o link comum
      window.location.href = URL_PAINEL;
    } else {
      error.style.display = 'block';
      document.querySelector('.teacher-card').style.animation = 'shake 0.5s ease';
      setTimeout(() => { document.querySelector('.teacher-card').style.animation = ''; }, 500);
    }
  });
</script>

</body>
</html>
