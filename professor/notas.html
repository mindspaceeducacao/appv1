<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Médias do Aluno | MindSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link id="favicon" rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2224%22%20height=%2224%22%20viewBox=%220%200%2024%2024%22%20fill=%22none%22%20stroke=%22currentColor%22%20stroke-width=%222%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%20class=%22icon%20icon-tabler%20icons-tabler-outline%20icon-tabler-chart-bar-popular%22%3E%3Cpath%20stroke=%22none%22%20d=%22M0%200h24v24H0z%22%20fill=%22none%22%20/%3E%3Cpath%20d=%22M3%2013a1%201%200%200%201%201%20-1h4a1%201%200%200%201%201%201v6a1%201%200%200%201%20-1%201h-4a1%201%200%200%201%20-1%20-1l0%20-6%22%20/%3E%3Cpath%20d=%22M9%209a1%201%200%200%201%201%20-1h4a1%201%200%200%201%201%201v10a1%201%200%200%201%20-1%201h-4a1%201%200%200%201%20-1%20-1l0%20-10%22%20/%3E%3Cpath%20d=%22M15%205a1%201%200%200%201%201%20-1h4a1%201%200%200%201%201%201v14a1%201%200%200%201%20-1%201h-4a1%201%200%200%201%20-1%20-1l0%20-14%22%20/%3E%3Cpath%20d=%22M4%2020h14%22%20/%3E%3C/svg%3E">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1d2b64;
    --royal: #2b57c3;
    --sky: #5c83f1;
    --gray-blue: #708ea8;
    --border-gray: #e0e0e0;
    --bg: #f4f7ff;
    --emerald: #0ea47a;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
    padding: 2.5rem 1.5rem;
    display: flex;
    justify-content: center;
  }

  .main-container {
    width: 100%; max-width: 580px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* BACK */
  .btn-back {
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--gray-blue);
    font-weight: 600; font-size: 0.83rem;
    margin-bottom: 1.5rem;
    padding: 8px 14px;
    border-radius: 10px;
    background: white; border: 1px solid var(--border-gray);
    transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }
  .btn-back:hover { color: var(--royal); border-color: rgba(44,87,195,0.3); transform: translateX(-2px); }

  /* HEADER */
  .header { margin-bottom: 1.75rem; }
  .header h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 3px; }
  .header p { color: var(--gray-blue); font-size: 0.87rem; font-weight: 500; }

  /* CARD */
  .card {
    background: white;
    padding: 2rem;
    border-radius: 22px;
    border: 1px solid var(--border-gray);
    box-shadow: 0 4px 24px rgba(29,43,100,0.07);
  }

  /* INPUT GROUP */
  .input-group { margin-bottom: 1.25rem; }
  .input-group label {
    display: block; font-size: 0.7rem; font-weight: 800;
    color: var(--gray-blue); text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 0.5rem;
  }

  .row {
    display: grid; grid-template-columns: 1fr 110px; gap: 10px; align-items: center;
  }

  .input-text {
    width: 100%; padding: 0.75rem 1rem;
    border-radius: 12px; border: 1.5px solid var(--border-gray);
    font-family: inherit; font-size: 0.9rem; font-weight: 500;
    color: var(--navy); background: var(--bg); outline: none;
    transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .input-text::placeholder { color: var(--gray-blue); font-weight: 400; }
  .input-text:focus { border-color: var(--royal); background: white; box-shadow: 0 0 0 3px rgba(44,87,195,0.08); }
  .input-text:disabled { opacity: 0.55; cursor: not-allowed; }

  .input-text.val {
    text-align: center; font-weight: 800;
    color: var(--royal); font-size: 1rem;
  }

  .divider { height: 1px; background: var(--border-gray); margin: 1.5rem 0; }

  /* MÉDIA FINAL */
  .media-final-box {
    background: linear-gradient(135deg, var(--navy), #2a3d8c);
    border-radius: 16px; padding: 1.5rem;
    text-align: center;
  }
  .media-label {
    display: block; font-size: 0.68rem; font-weight: 800;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(255,255,255,0.55); margin-bottom: 0.4rem;
  }
  .media-val {
    font-size: 2.8rem; font-weight: 800;
    color: white; background: none; border: none;
    width: 100%; text-align: center; outline: none;
    font-family: inherit;
  }

  .info-text {
    font-size: 0.72rem; color: var(--gray-blue);
    margin-top: 1.25rem; text-align: center; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
</style>
</head>
<body>

<div class="main-container">
  <a href="dashboard.html" class="btn-back">
    <i class="ti ti-arrow-left"></i> Voltar ao Painel
  </a>

  <div class="header">
    <h1 id="titulo-pagina">Lançamento de Notas</h1>
    <p id="subtitulo-materia">Controle de rendimento escolar</p>
  </div>

  <div class="card">

    <div class="input-group">
      <label>Atividade 1 <span style="opacity:.6">(Max: 10.0)</span></label>
      <div class="row">
        <input type="text" class="input-text salvavel" id="t1" placeholder="Nome da atividade">
        <input type="number" step="1.0" class="input-text val salvavel" id="n1" data-max="10.0" placeholder="0.0">
      </div>
    </div>

    <div class="input-group">
      <label>Atividade 2 <span style="opacity:.6">(Max: 10.0)</span></label>
      <div class="row">
        <input type="text" class="input-text salvavel" id="t2" placeholder="Nome da atividade">
        <input type="number" step="1.0" class="input-text val salvavel" id="n2" data-max="10.0" placeholder="0.0">
      </div>
    </div>

    <div class="input-group">
      <label>Atividade 3 <span style="opacity:.6">(Max: 10.0)</span></label>
      <div class="row">
        <input type="text" class="input-text salvavel" id="t3" placeholder="Nome da atividade">
        <input type="number" step="1.0" class="input-text val salvavel" id="n3" data-max="10.0" placeholder="0.0">
      </div>
    </div>

    <div class="input-group">
      <label>Outros <span style="opacity:.6">(Max: 20.0)</span></label>
      <div class="row">
        <input type="text" class="input-text salvavel" id="titulo_outros" placeholder="Participação, etc">
        <input type="number" step="1.0" class="input-text val salvavel" id="n_outros" data-max="20.0" placeholder="0.0">
      </div>
    </div>

    <div class="input-group">
      <label>Avaliação Final <span style="opacity:.6">(Max: 50.0)</span></label>
      <div class="row">
        <input type="text" class="input-text" value="Avaliação Acadêmica Diagnóstica" disabled>
        <input type="number" step="1.0" class="input-text val salvavel" id="n_prova" data-max="50.0" placeholder="0.0">
      </div>
    </div>

    <div class="divider"></div>

    <div class="media-final-box">
      <span class="media-label">Média Final</span>
      <input type="text" id="media_final" class="media-val" value="0.0" readonly>
    </div>

    <p class="info-text">
      <i class="ti ti-device-floppy" style="font-size:14px; color: var(--sky)"></i>
      Dados salvos automaticamente conforme você digita.
    </p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAs3OTqOeVVzcxlrcM8Th5ObkhtXca69Ac",
    authDomain: "mindspace-educacao.firebaseapp.com",
    projectId: "mindspace-educacao",
    storageBucket: "mindspace-educacao.firebasestorage.app",
    messagingSenderId: "569394609531",
    appId: "1:569394609531:web:9ab5ba6bc2181bc5a911de",
    databaseURL: "https://mindspace-educacao-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const usuarioFull = sessionStorage.getItem('usuario') || "hadassaartes";
  const materiaAtiva = sessionStorage.getItem('materia') || "Artes";
  const usuarioAtivo = usuarioFull.replace(/(artes|port|cien|mat)$/, "");

  const configMaterias = {
    "Ciências":   { db: "cien" },
    "Português":  { db: "port" },
    "Matemática": { db: "mat"  },
    "Artes":      { db: "artes" }
  };

  const config = configMaterias[materiaAtiva] || configMaterias["Artes"];
  const materiaDb = config.db;

  document.title = `Notas de ${materiaAtiva}`;
  document.getElementById('subtitulo-materia').innerText = `Disciplina: ${materiaAtiva}`;

  const dbRef = ref(db, `${usuarioAtivo}/${materiaDb}`);
  const campos = document.querySelectorAll('.salvavel');
  const camposNotas = document.querySelectorAll('.val');
  const displayMedia = document.getElementById('media_final');

  function calcularMedia() {
    let total = 0;
    camposNotas.forEach(nota => {
      let valor = parseFloat(nota.value) || 0;
      let maximo = parseFloat(nota.getAttribute('data-max'));
      if (valor > maximo) { valor = maximo; nota.value = maximo; }
      total += valor;
    });
    displayMedia.value = total.toFixed(1);
  }

  onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      campos.forEach(campo => {
        if (data[campo.id] !== undefined) campo.value = data[campo.id];
      });
      calcularMedia();
    }
  });

  campos.forEach(campo => {
    campo.addEventListener('input', () => {
      if (campo.classList.contains('val')) calcularMedia();
      update(dbRef, { [campo.id]: campo.value });
    });
  });
</script>
</body>
</html>
